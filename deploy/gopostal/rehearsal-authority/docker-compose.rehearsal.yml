name: gopostal-rehearsal

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.6-bookworm
    container_name: gopostal_rehearsal_db
    restart: unless-stopped
    env_file:
      - /srv/docker/stacks/gopostal-rehearsal/database.env
    volumes:
      - gopostal_rehearsal_postgres:/var/lib/postgresql/data
    networks:
      - gopostal_rehearsal_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    logging: *bounded-logging

  web:
    image: gopostal-rehearsal-web:${GOPOSTAL_IMAGE_TAG:?GOPOSTAL_IMAGE_TAG is required}
    build:
      context: /srv/gopostal/rehearsal-app/backend
      dockerfile: Dockerfile
    container_name: gopostal_rehearsal_web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    env_file:
      - /srv/docker/stacks/gopostal-rehearsal/application.env
    environment:
      DEBUG: "false"
      FLASK_DEBUG: "0"
      ENABLE_SWAGGER_UI: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8510:5000"
    networks:
      - gopostal_rehearsal_edge
      - gopostal_rehearsal_data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging: *bounded-logging

  frontend:
    image: gopostal-rehearsal-frontend:${GOPOSTAL_IMAGE_TAG:?GOPOSTAL_IMAGE_TAG is required}
    container_name: gopostal_rehearsal_frontend
    restart: unless-stopped
    user: "101:101"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8511:8080"
    networks:
      - gopostal_rehearsal_edge
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0755
      - /var/run:rw,noexec,nosuid,nodev,size=4m,uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    logging: *bounded-logging

volumes:
  gopostal_rehearsal_postgres:
    name: gopostal_rehearsal_postgres

networks:
  gopostal_rehearsal_edge:
    name: gopostal_rehearsal_edge
  gopostal_rehearsal_data:
    name: gopostal_rehearsal_data
    internal: true
