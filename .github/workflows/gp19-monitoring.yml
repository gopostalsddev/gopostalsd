name: GP-19 monitoring contract

on:
  push:
    branches:
      - codex/gp01-migration-startup-separation
  pull_request:
  workflow_dispatch:

jobs:
  monitoring-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Static monitoring contract
        working-directory: backend
        run: >-
          python -m pytest --noconftest
          -o "addopts=--verbose --tb=short --strict-markers"
          tests/test_gp19_monitoring_contract.py
      - name: Validate Prometheus rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/deploy/gopostal/monitoring/prometheus-alerts.yml:/rules.yml:ro"
          prom/prometheus:v3.5.0
          check rules /rules.yml
