name: GP-17 acceptance evidence gate

on:
  push:
    branches:
      - codex/gp01-migration-startup-separation
  pull_request:
  workflow_dispatch:

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Validate fail-closed evidence contract
        working-directory: backend
        run: >-
          python -m pytest --noconftest
          -o "addopts=--verbose --tb=short --strict-markers"
          tests/test_gp17_acceptance_evidence.py
      - name: Prove an empty evidence directory cannot claim readiness
        run: |
          mkdir -p "$RUNNER_TEMP/empty-evidence"
          set +e
          python deploy/gopostal/verify-acceptance-evidence.py \
            --requirements deploy/gopostal/acceptance/requirements.json \
            --evidence-dir "$RUNNER_TEMP/empty-evidence" \
            --release-sha "$(git rev-parse HEAD)" \
            --report "$RUNNER_TEMP/gp17-report.json"
          rc=$?
          set -e
          test "$rc" -eq 3
          python - "$RUNNER_TEMP/gp17-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["verdict"] == "NOT_READY"
          assert report["counts"]["pass"] == 0
          assert report["counts"]["invalid"] == 0
          assert report["counts"]["pending"] > 0
          PY
