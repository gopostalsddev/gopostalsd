name: GP-04 Square environment contract

on:
  push:
    branches:
      - codex/gp01-migration-startup-separation
  pull_request:
  workflow_dispatch:

jobs:
  square-environment:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SINALITE_CLIENT_ID: gp04-ci-client
      SINALITE_CLIENT_SECRET: gp04-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Backend Square environment contract
        working-directory: backend
        run: >-
          python -m pytest
          -o "addopts=--verbose --tb=short --strict-markers"
          tests/test_gp04_square_environment.py
      - run: npm ci
        working-directory: frontend
      - run: npm run test:square-config
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_SQUARE_ENVIRONMENT: sandbox
          VITE_SQUARE_APPLICATION_ID: sandbox-sq0idb-gp04-ci
          VITE_SQUARE_LOCATION_ID: gp04-ci-location
