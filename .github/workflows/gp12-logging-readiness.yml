name: GP-12 logging and readiness

on:
  push:
    branches:
      - codex/gp01-migration-startup-separation
  pull_request:
  workflow_dispatch:

jobs:
  runtime-signals:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SINALITE_CLIENT_ID: gp12-ci-client
      SINALITE_CLIENT_SECRET: gp12-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Stdout logging and health contract
        working-directory: backend
        run: >-
          python -m pytest
          -o "addopts=--verbose --tb=short --strict-markers"
          tests/test_gp12_logging_readiness.py
          tests/test_gp01_startup_lifecycle.py
