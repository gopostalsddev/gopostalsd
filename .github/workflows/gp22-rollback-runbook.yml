name: GP-22 rollback and recovery contract

on:
  push:
    branches:
      - codex/gp01-migration-startup-separation
  pull_request:
  workflow_dispatch:

jobs:
  rollback-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Validate rollback safety contract
        working-directory: backend
        run: >-
          python -m pytest --noconftest
          -o "addopts=--verbose --tb=short --strict-markers"
          tests/test_gp22_rollback_runbook.py
