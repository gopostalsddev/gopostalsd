name: GP-13 storage and request limits

on:
  push:
    branches:
      - codex/gp01-migration-startup-separation
  pull_request:
  workflow_dispatch:

jobs:
  storage-boundary:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      SINALITE_CLIENT_ID: gp13-ci-client
      SINALITE_CLIENT_SECRET: gp13-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - name: Request and storage contract
        working-directory: backend
        run: >-
          python -m pytest
          -o "addopts=--verbose --tb=short --strict-markers"
          tests/test_gp13_storage_request_limits.py
          tests/test_gp04_square_environment.py
